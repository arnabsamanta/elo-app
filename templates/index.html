<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo League App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <style>
        .screen { display: none; }
        .active-screen { display: block; }
        .nav-link { cursor: pointer; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div id="auth-screen" class="screen active-screen">
        <div class="card p-4 mx-auto shadow-sm" style="max-width: 400px;">
            <h3 class="text-center">Elo League</h3>
            <div class="mb-3">
                <input type="text" id="auth-username" class="form-control" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="password" id="auth-password" class="form-control" placeholder="Password">
            </div>
            <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>
            <button class="btn btn-secondary w-100" onclick="signup()">Sign Up</button>
            <p id="auth-msg" class="text-danger mt-2 text-center"></p>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Your Groups</h2>
            <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="new-group-name" class="form-control" placeholder="New Group Name">
            <button class="btn btn-success" onclick="createGroup()">Create Group</button>
        </div>

        <div id="groups-list" class="list-group"></div>
    </div>

    <div id="group-screen" class="screen">
        <button class="btn btn-secondary mb-3" onclick="showScreen('dashboard-screen')">&larr; Back</button>
        <h2 id="group-title">Group Name</h2>

        <ul class="nav nav-tabs mb-3" id="groupTabs">
            <li class="nav-item"><a id="nav-link-matches" class="nav-link active" onclick="switchTab('matches')">Matches</a></li>
            <li class="nav-item"><a id="nav-link-leaderboard" class="nav-link" onclick="switchTab('leaderboard')">Leaderboard</a></li>
            <li class="nav-item"><a id="nav-link-members" class="nav-link" onclick="switchTab('members')">Members</a></li>
        </ul>

        <div id="tab-matches" class="tab-content active-tab">
            <div id="admin-match-controls" class="card p-3 mb-3 bg-white shadow-sm" style="display:none;">
                <h5 id="match-form-title">Add Match</h5>
                <input type="hidden" id="edit-match-id">
                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="small text-muted">Winner</label>
                        <select id="match-winner" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="small text-muted">Loser</label>
                        <select id="match-loser" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="small text-muted">Score</label>
                        <input type="text" id="match-score" class="form-control" placeholder="21-19">
                    </div>
                    <div class="col-md-3">
                        <label class="small text-muted">Date & Time</label>
                        <input type="datetime-local" id="match-date" class="form-control">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button id="save-match-btn" class="btn btn-primary w-100" onclick="saveMatch()">Add</button>
                    </div>
                </div>
                <button id="cancel-edit-btn" class="btn btn-sm btn-secondary mt-2" style="display:none" onclick="resetMatchForm()">Cancel Edit</button>
            </div>
            <div id="matches-list" class="list-group"></div>
        </div>

        <div id="tab-leaderboard" class="tab-content" style="display:none;">
            <div class="card p-3 mb-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5>Elo History</h5>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="updateChartRange('1W')">1W</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="updateChartRange('1M')">1M</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="updateChartRange('1Y')">1Y</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary active" onclick="updateChartRange('ALL')">All</button>
                    </div>
                </div>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="eloChart"></canvas>
                </div>
            </div>
            <table class="table table-striped bg-white shadow-sm">
                <thead><tr><th>Rank</th><th>Player</th><th>Elo</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        <div id="tab-members" class="tab-content" style="display:none;">
            <div id="admin-member-controls" class="input-group mb-3" style="display:none;">
                <input type="text" id="new-member-username" class="form-control" placeholder="Username to add">
                <button class="btn btn-primary" onclick="addMember()">Add Member</button>
            </div>
            <ul id="members-list" class="list-group shadow-sm"></ul>
        </div>
    </div>
</div>

<script>
    let currentGroupId = null;
    let isAdmin = false;
    let eloChartInstance = null;
    let allMembers = [];
    let fullGraphData = [];

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        if(id === 'dashboard-screen') loadGroups();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).style.display = 'block';

        const linkObj = document.getElementById('nav-link-' + tabName);
        if(linkObj) linkObj.classList.add('active');
    }

    async function api(url, method='GET', data=null) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (data) opts.body = JSON.stringify(data);
        const res = await fetch('/api' + url, opts);
        return res;
    }

    async function login() {
        const u = document.getElementById('auth-username').value;
        const p = document.getElementById('auth-password').value;
        const res = await api('/login', 'POST', { username: u, password: p });
        if (res.ok) showScreen('dashboard-screen');
        else document.getElementById('auth-msg').innerText = "Invalid credentials";
    }
    async function signup() {
        const u = document.getElementById('auth-username').value;
        const p = document.getElementById('auth-password').value;
        const res = await api('/signup', 'POST', { username: u, password: p });
        if (res.ok) alert("Signed up! Please login.");
        else alert("Username likely taken.");
    }
    async function logout() { await api('/logout'); showScreen('auth-screen'); }

    // --- DASHBOARD ---
    async function loadGroups() {
        const res = await api('/groups');
        const groups = await res.json();
        const list = document.getElementById('groups-list');
        list.innerHTML = '';
        groups.forEach(g => {
            const item = document.createElement('a');
            item.className = 'list-group-item list-group-item-action d-flex justify-content-between';
            item.innerHTML = `<span>${g.name}</span>`;
            item.onclick = () => loadGroupDetails(g.id);
            list.appendChild(item);
        });
    }
    async function createGroup() {
        const name = document.getElementById('new-group-name').value;
        if(!name) return;
        await api('/groups', 'POST', { name });
        document.getElementById('new-group-name').value = '';
        loadGroups();
    }

    // --- GROUP DETAILS ---
    async function loadGroupDetails(id) {
        currentGroupId = id;
        const res = await api(`/groups/${id}/details`);
        if(!res.ok) return;
        const data = await res.json();

        isAdmin = data.is_user_admin;
        allMembers = data.members;
        fullGraphData = data.graph_data;

        document.getElementById('group-title').innerText = data.group_name;

        renderMatches(data.matches);
        setupMatchControls();
        renderLeaderboard(data.leaderboard);
        updateChartRange('ALL');
        renderMembers(data.members);

        showScreen('group-screen');
        switchTab('matches');
    }

    // --- GRAPH LOGIC ---
    function updateChartRange(range) {
        document.querySelectorAll('.btn-group .btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toUpperCase() === range || (range === 'ALL' && btn.innerText === 'All')) {
                btn.classList.add('active');
            }
        });

        const now = new Date();
        let startDate = null;

        if (range === '1W') startDate = new Date(now.setDate(now.getDate() - 7));
        else if (range === '1M') startDate = new Date(now.setMonth(now.getMonth() - 1));
        else if (range === '1Y') startDate = new Date(now.setFullYear(now.getFullYear() - 1));

        const filteredDatasets = fullGraphData.map(dataset => {
            return {
                ...dataset,
                data: dataset.data.filter(point => {
                    if (!startDate) return true;
                    return new Date(point.x) >= startDate;
                })
            };
        });

        renderGraph(filteredDatasets);
    }

    function renderGraph(datasets) {
        const ctx = document.getElementById('eloChart').getContext('2d');
        if (eloChartInstance) eloChartInstance.destroy();

        eloChartInstance = new Chart(ctx, {
            type: 'line',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'day',
                            displayFormats: { day: 'MMM d' }
                        },
                        title: { display: true, text: 'Date' }
                    },
                    y: {
                        title: { display: true, text: 'Elo Rating' }
                    }
                }
            }
        });
    }

    // --- MATCHES & MEMBERS ---
    function renderMatches(matches) {
        const list = document.getElementById('matches-list');
        list.innerHTML = '';
        matches.forEach(m => {
            let controls = '';
            if (isAdmin) {
                const matchJson = JSON.stringify(m).replace(/"/g, '&quot;');
                controls = `
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm btn-link text-secondary p-0 me-3" onclick="editMatchSetup(${matchJson})" title="Edit">
                            <i class="bi bi-pencil-square" style="font-size: 1.2rem;"></i>
                        </button>
                        <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteMatch(${m.id})" title="Delete">
                            <i class="bi bi-trash" style="font-size: 1.2rem;"></i>
                        </button>
                    </div>`;
            }
            list.innerHTML += `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${m.winner}</strong> def. ${m.loser} <span class="badge bg-light text-dark border ms-1 me-1">${m.score}</span>
                        <div class="text-muted small">${m.date}</div>
                    </div>
                    ${controls}
                </div>`;
        });
    }

    function setupMatchControls() {
        const div = document.getElementById('admin-match-controls');
        div.style.display = isAdmin ? 'block' : 'none';
        if(isAdmin) populateDropdowns();
        resetMatchForm();
    }

    function populateDropdowns() {
        const win = document.getElementById('match-winner');
        const los = document.getElementById('match-loser');
        win.innerHTML = '<option value="">Winner...</option>';
        los.innerHTML = '<option value="">Loser...</option>';
        allMembers.forEach(m => {
            win.innerHTML += `<option value="${m.id}">${m.username}</option>`;
            los.innerHTML += `<option value="${m.id}">${m.username}</option>`;
        });
    }

    async function saveMatch() {
        const id = document.getElementById('edit-match-id').value;
        const winnerId = document.getElementById('match-winner').value;
        const loserId = document.getElementById('match-loser').value;
        const score = document.getElementById('match-score').value;
        const date = document.getElementById('match-date').value;

        if(!winnerId || !loserId || winnerId === loserId) return alert("Invalid players");
        if(!score) return alert("Enter score");

        const payload = { winner_id: winnerId, loser_id: loserId, score, date };
        let res;
        if (id) res = await api(`/matches/${id}`, 'PUT', payload);
        else res = await api(`/groups/${currentGroupId}/add_match`, 'POST', payload);

        if(res.ok) {
            resetMatchForm();
            loadGroupDetails(currentGroupId);
        }
    }

    function editMatchSetup(match) {
        document.getElementById('match-form-title').innerText = "Edit Match";
        document.getElementById('save-match-btn').innerText = "Update";
        document.getElementById('cancel-edit-btn').style.display = 'block';
        document.getElementById('edit-match-id').value = match.id;
        document.getElementById('match-winner').value = match.winner_id;
        document.getElementById('match-loser').value = match.loser_id;
        document.getElementById('match-score').value = match.score;
        document.getElementById('match-date').value = match.date.replace(' ', 'T');
        window.scrollTo(0,0);
    }

    function resetMatchForm() {
        document.getElementById('match-form-title').innerText = "Add Match";
        document.getElementById('save-match-btn').innerText = "Add";
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.getElementById('edit-match-id').value = '';
        document.getElementById('match-winner').value = '';
        document.getElementById('match-loser').value = '';
        document.getElementById('match-score').value = '';
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('match-date').value = now.toISOString().slice(0,16);
    }

    async function deleteMatch(id) {
        if(confirm("Are you sure?")) {
            await api(`/matches/${id}`, 'DELETE');
            loadGroupDetails(currentGroupId);
        }
    }

    function renderLeaderboard(data) {
        const body = document.getElementById('leaderboard-body');
        body.innerHTML = '';
        data.forEach((p, idx) => {
            body.innerHTML += `<tr><td>${idx+1}</td><td>${p.username}</td><td>${p.elo}</td></tr>`;
        });
    }

    function renderMembers(members) {
        const list = document.getElementById('members-list');
        list.innerHTML = '';
        members.forEach(p => {
            let adminBadge = p.is_admin ? '<span class="badge bg-warning text-dark ms-2">Admin</span>' : '';
            let makeAdminBtn = (isAdmin && !p.is_admin) ?
                `<button class="btn btn-sm btn-outline-warning float-end" onclick="makeAdmin(${p.id})">Make Admin</button>` : '';
            list.innerHTML += `<li class="list-group-item">${p.username} ${adminBadge} ${makeAdminBtn}</li>`;
        });
        document.getElementById('admin-member-controls').style.display = isAdmin ? 'flex' : 'none';
    }

    async function addMember() {
        const username = document.getElementById('new-member-username').value;
        const res = await api(`/groups/${currentGroupId}/add_member`, 'POST', { username });
        if(res.ok) {
            document.getElementById('new-member-username').value = '';
            loadGroupDetails(currentGroupId);
        } else alert("User error");
    }

    async function makeAdmin(userId) {
        if(confirm("Promote to admin?")) {
            await api(`/groups/${currentGroupId}/make_admin`, 'POST', { user_id: userId });
            loadGroupDetails(currentGroupId);
        }
    }

    // CHECK SESSION ON LOAD
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await api('/session');
            if(res.ok) {
                const data = await res.json();
                if(data.auth) showScreen('dashboard-screen');
            }
        } catch(e) { console.error("Session check failed", e); }
    });
</script>
</body>
</html>
